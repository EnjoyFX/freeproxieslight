[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "freeproxieslight"
description = "Lightweight, dependency-free harvester of valid proxies."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["proxy", "proxies", "scraper", "validator", "anonymity"]
dynamic = ["version"]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Internet :: Proxy Servers",
    "Operating System :: OS Independent",
]

[project.scripts]
freeproxieslight = "freeproxieslight.cli:main"

[tool.setuptools]
packages = ["freeproxieslight"]

[tool.setuptools.dynamic]
version = { attr = "freeproxieslight.__version__" }
